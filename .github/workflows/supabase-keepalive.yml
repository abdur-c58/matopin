# Supabase pauses free projects after 7 days without database activity.
# This makes one small real database call every 3 days so it never goes idle.
# Needs repo secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (same values as .env.local).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call a read-only database function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/matopin_reaction_emojis" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase answered $status"
          if [ "$status" != "200" ]; then
            cat response.txt
            exit 1
          fi
